{% extends "base.html" %}

{% block content %}

<h1>{{ title }}</h1>

<p class="text-muted">
    Demande {{ request_obj.reference }} —
    {{ request_obj.organization.name }}
</p>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Enregistrer
            </button>

            <a
                href="{% url 'requests:request_detail' request_obj.pk %}"
                class="btn btn-outline-secondary"
            >
                Annuler
            </a>
        </form>

    </div>
</div>

{% endblock %}
