{% extends "base.html" %}

{% block content %}

<h1>{{ title }}</h1>

<p class="text-muted">
    Cotation {{ quotation.reference }}
</p>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Enregistrer
            </button>

            <a
                href="{% url 'quotations:quotation_detail' quotation.pk %}"
                class="btn btn-outline-secondary"
            >
                Annuler
            </a>

        </form>

    </div>
</div>

{% endblock %}
