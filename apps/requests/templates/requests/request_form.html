{% extends "base.html" %}

{% block content %}

<h2>{{ page_title }}</h2>

<p class="text-muted">
    Informations de la demande
</p>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger small">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            <button class="btn btn-primary">
                Enregistrer
            </button>

            <a href="{% url 'requests:request_list' %}"
               class="btn btn-outline-secondary">
                Annuler
            </a>

        </form>

    </div>
</div>

{% endblock %}
